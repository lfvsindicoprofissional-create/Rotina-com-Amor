<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none">
  <!-- Fundo quente e acolhedor de sala iluminada -->
  <rect width="1200" height="900" rx="32" fill="#F5EDE3" />
  <circle cx="1020" cy="160" r="260" fill="#F6DCDD" opacity="0.6" />
  <circle cx="160" cy="760" r="240" fill="#E6D8C6" opacity="0.55" />

  <!-- Sombra suave do quadro na parede -->
  <rect x="136" y="108" width="944" height="696" rx="36" fill="#3D3535" opacity="0.07" />

  <!-- Moldura do Quadro Visual Semanal -->
  <rect x="120" y="92" width="944" height="696" rx="32" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="6" />

  <!-- Topo do Quadro: Furos de fixação / cordão decorativo e título -->
  <circle cx="220" cy="144" r="10" fill="#E6D8C6" />
  <circle cx="964" cy="144" r="10" fill="#E6D8C6" />
  <rect x="372" y="122" width="440" height="52" rx="26" fill="#F6DCDD" />
  <text x="592" y="155" text-anchor="middle" fill="#3D3535" font-family="Georgia, serif" font-size="24" font-weight="700">Rotina com Carinho — Nossa Semana</text>

  <!-- Colunas dos dias (Seg a Sex em destaque visual) -->
  <!-- Segunda -->
  <rect x="164" y="202" width="160" height="44" rx="12" fill="#9CAF88" />
  <text x="244" y="230" text-anchor="middle" fill="#FFFDFB" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Segunda</text>

  <!-- Terça -->
  <rect x="340" y="202" width="160" height="44" rx="12" fill="#F5EDE3" stroke="#E6D8C6" stroke-width="2" />
  <text x="420" y="230" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Terça</text>

  <!-- Quarta -->
  <rect x="516" y="202" width="160" height="44" rx="12" fill="#F5EDE3" stroke="#E6D8C6" stroke-width="2" />
  <text x="596" y="230" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Quarta</text>

  <!-- Quinta -->
  <rect x="692" y="202" width="160" height="44" rx="12" fill="#F5EDE3" stroke="#E6D8C6" stroke-width="2" />
  <text x="772" y="230" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Quinta</text>

  <!-- Sexta -->
  <rect x="868" y="202" width="152" height="44" rx="12" fill="#F6DCDD" />
  <text x="944" y="230" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Sexta</text>

  <!-- Linha 1 de Cartões Removíveis (Manhã) -->
  <!-- Seg: Acordar -->
  <g transform="translate(164, 266)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#9CAF88" stroke-width="3" />
    <circle cx="80" cy="52" r="24" fill="#F5EDE3" />
    <circle cx="80" cy="52" r="12" fill="#E8B4B8" />
    <path d="M80 20V26M80 78V84M48 52H54M106 52H112M57 29L62 34M98 70L103 75M103 29L98 34M62 70L57 75" stroke="#A8505C" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Acordar</text>
  </g>

  <!-- Ter: Escovar os dentes -->
  <g transform="translate(340, 266)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2.5" />
    <circle cx="80" cy="52" r="24" fill="#F6DCDD" />
    <path d="M62 60L96 38M86 32L98 40L92 48L80 40Z" stroke="#A8505C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Escovar dentes</text>
  </g>

  <!-- Qua: Tomar café -->
  <g transform="translate(516, 266)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2.5" />
    <circle cx="80" cy="52" r="24" fill="#F5EDE3" />
    <path d="M66 44H90V58C90 64.6 84.6 70 78 70C71.4 70 66 64.6 66 58V44Z" stroke="#5E7250" stroke-width="2.5" />
    <path d="M90 48H95C97.8 48 100 50.2 100 53C100 55.8 97.8 58 95 58H90" stroke="#5E7250" stroke-width="2.5" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Tomar café</text>
  </g>

  <!-- Qui: Ir à escola -->
  <g transform="translate(692, 266)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2.5" />
    <circle cx="80" cy="52" r="24" fill="#F6DCDD" />
    <rect x="66" y="40" width="28" height="26" rx="6" stroke="#A8505C" stroke-width="2.5" />
    <path d="M74 40V36C74 33.8 75.8 32 78 32H82C84.2 32 86 33.8 86 36V40" stroke="#A8505C" stroke-width="2.5" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Ir à escola</text>
  </g>

  <!-- Sex: Brincar -->
  <g transform="translate(868, 266)">
    <rect width="152" height="132" rx="18" fill="#FFFDFB" stroke="#E8B4B8" stroke-width="2.5" />
    <circle cx="76" cy="52" r="24" fill="#F5EDE3" />
    <path d="M76 34L81 45L93 46.5L84 55L86.5 67L76 61L65.5 67L68 55L59 46.5L71 45L76 34Z" stroke="#A8505C" stroke-width="2.3" stroke-linejoin="round" />
    <text x="76" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Brincar</text>
  </g>

  <!-- Linha 2 de Cartões Removíveis (Tarde) -->
  <!-- Seg: Escola -->
  <g transform="translate(164, 418)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2.5" />
    <circle cx="80" cy="52" r="24" fill="#F5EDE3" />
    <path d="M64 46L80 36L96 46L80 56L64 46Z" stroke="#5E7250" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M70 51V62C70 65 75 68 80 68C85 68 90 65 90 62V51" stroke="#5E7250" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Ir à escola</text>
  </g>

  <!-- Ter: Atendimentos -->
  <g transform="translate(340, 418)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#9CAF88" stroke-width="2.5" />
    <circle cx="80" cy="52" r="24" fill="#F5EDE3" />
    <path d="M80 66C80 66 64 56 64 45C64 39.5 68.5 35 74 35C77.2 35 80 37 80 37C80 37 82.8 35 86 35C91.5 35 96 39.5 96 45C96 56 80 66 80 66Z" stroke="#5E7250" stroke-width="2.5" stroke-linejoin="round" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Atendimentos</text>
  </g>

  <!-- Qua: Slot de velcro esperando o cartão que está sendo colocado -->
  <g transform="translate(516, 418)">
    <rect width="160" height="132" rx="18" fill="#F5EDE3" stroke="#9CAF88" stroke-width="2.5" stroke-dasharray="8 6" />
    <circle cx="80" cy="66" r="18" fill="#E6D8C6" opacity="0.7" />
  </g>

  <!-- Cartão destacado sendo posicionado com carinho ("Brincar") -->
  <g transform="translate(534, 396) rotate(-4)">
    <rect x="4" y="10" width="160" height="132" rx="18" fill="#3D3535" opacity="0.12" />
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#A8505C" stroke-width="3.5" />
    <circle cx="80" cy="50" r="24" fill="#F6DCDD" />
    <rect x="66" y="38" width="13" height="13" rx="3" stroke="#A8505C" stroke-width="2.2" />
    <rect x="81" y="49" width="13" height="13" rx="3" stroke="#5E7250" stroke-width="2.2" />
    <text x="80" y="106" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Brincar</text>
  </g>

  <!-- Qui: Descansar -->
  <g transform="translate(692, 418)">
    <rect width="160" height="132" rx="18" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2.5" />
    <circle cx="80" cy="52" r="24" fill="#F5EDE3" />
    <path d="M66 56C66 50 71 45 77 45C78.5 41 82.5 38 87 38C93 38 98 43 98 49C98 55 93 60 87 60H70C67.8 60 66 58.2 66 56Z" stroke="#5E7250" stroke-width="2.5" stroke-linejoin="round" />
    <text x="80" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Descansar</text>
  </g>

  <!-- Sex: Dormir -->
  <g transform="translate(868, 418)">
    <rect width="152" height="132" rx="18" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2.5" />
    <circle cx="76" cy="52" r="24" fill="#F6DCDD" />
    <path d="M84 62C74.6 62 67 54.4 67 45C67 40.8 68.5 37 71 34C64.2 35.8 59 42 59 49.5C59 58.6 66.4 66 75.5 66C81.8 66 87.2 62.5 90 57.3C88.1 60.2 86.2 62 84 62Z" stroke="#A8505C" stroke-width="2.5" stroke-linejoin="round" />
    <text x="76" y="108" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Dormir</text>
  </g>

  <!-- Faixa inferior de cartões disponíveis na base do quadro -->
  <rect x="164" y="582" width="856" height="156" rx="22" fill="#F5EDE3" stroke="#E6D8C6" stroke-width="2.5" />
  <text x="200" y="618" fill="#6B5F5F" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Cartões removíveis prontos para organizar a semana:</text>

  <g transform="translate(200, 636)">
    <rect width="142" height="78" rx="14" fill="#FFFDFB" stroke="#9CAF88" stroke-width="2" />
    <circle cx="38" cy="39" r="16" fill="#F5EDE3" />
    <circle cx="38" cy="39" r="7" fill="#5E7250" />
    <text x="88" y="44" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Manhã</text>
  </g>

  <g transform="translate(362, 636)">
    <rect width="166" height="78" rx="14" fill="#FFFDFB" stroke="#E8B4B8" stroke-width="2" />
    <circle cx="38" cy="39" r="16" fill="#F6DCDD" />
    <circle cx="38" cy="39" r="7" fill="#A8505C" />
    <text x="100" y="44" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Combinados</text>
  </g>

  <g transform="translate(548, 636)">
    <rect width="154" height="78" rx="14" fill="#FFFDFB" stroke="#E6D8C6" stroke-width="2" />
    <circle cx="38" cy="39" r="16" fill="#F5EDE3" />
    <circle cx="38" cy="39" r="7" fill="#9CAF88" />
    <text x="94" y="44" text-anchor="middle" fill="#3D3535" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Autonomia</text>
  </g>

  <g transform="translate(722, 636)">
    <rect width="260" height="78" rx="14" fill="#F6DCDD" />
    <text x="130" y="45" text-anchor="middle" fill="#3D3535" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="600">Sua rotina, do seu jeito!</text>
  </g>
</svg>
